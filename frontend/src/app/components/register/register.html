<!-- src/app/components/register/register.component.html -->
<div class="min-h-screen flex items-center justify-center bg-gray-100">
  <div class="bg-white shadow-lg rounded-lg p-8 w-full max-w-md">
    <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">Inscription</h2>

    <form (ngSubmit)="register()" class="space-y-4">
      <div>
        <label class="block text-gray-700 mb-1">Nom d'utilisateur</label>
        <input
          type="text"
          [(ngModel)]="username"
          name="username"
          required
          class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>

      <div>
        <label class="block text-gray-700 mb-1">Mot de passe</label>
        <input
          type="password"
          [(ngModel)]="password"
          name="password"
          required
          class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>

      <div>
        <label class="block text-gray-700 mb-1">Confirmer le mot de passe</label>
        <input
          type="password"
          [(ngModel)]="confirmPassword"
          name="confirmPassword"
          required
          class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>

      <button
        type="submit"
        class="w-full bg-green-600 text-white py-2 rounded-md hover:bg-green-700 transition-colors"
      >
        S’inscrire
      </button>
    </form>

    <!-- Message d'erreur -->
    <div *ngIf="errorMessage" class="mt-4 text-red-600 text-center font-medium">
      {{ errorMessage }}
    </div>

    <!-- Message de succès -->
    <div *ngIf="successMessage" class="mt-4 text-green-600 text-center font-medium">
      {{ successMessage }}
    </div>

    <!-- Bouton pour rediriger vers Login -->
    <div class="mt-6 text-center">
      <p class="text-gray-600 mb-2">Vous avez déjà un compte ?</p>
      <button
        (click)="goToConnect()"
        class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition-colors"
      >
        Se connecter
      </button>
    </div>
  </div>
</div>
