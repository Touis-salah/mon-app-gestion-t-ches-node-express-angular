<div class="min-h-screen flex bg-gradient-to-br from-blue-50 to-indigo-100">

  <!-- Sidebar -->
  <app-sidebar
    [isSidebarOpen]="isSidebarOpen"
    (sidebarToggled)="handleSidebarToggle()">
  </app-sidebar>

  <!-- Main content -->
  <div class="flex-1 flex flex-col lg:ml-64">

    <!-- Topbar mobile -->
    <header class="lg:hidden bg-white shadow-md p-4 flex items-center justify-between">
      <button (click)="handleSidebarToggle()" class="text-gray-700">
        <svg xmlns="http://www.w3.org/2000/svg"
             fill="none"
             viewBox="0 0 24 24"
             stroke-width="2"
             stroke="currentColor"
             class="w-6 h-6">
          <path stroke-linecap="round"
                stroke-linejoin="round"
                d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
      <h2 class="font-semibold text-gray-800">Task Manager</h2>
    </header>

    <!-- Router outlet -->
    <main class="flex-1 p-6">
      <router-outlet></router-outlet>
    </main>
  </div>
